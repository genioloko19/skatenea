    RaffleDetailResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            raffle: { $ref: '#/components/schemas/Raffle' }
            sellers:
              type: array
              items: { type: object }
            ticket_stats:
              type: object
              additionalProperties: { type: integer }
            approvals:
              type: array
              items: { type: object }
    TicketListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            tickets:
              type: array
              items: { $ref: '#/components/schemas/Ticket' }
        meta:
          type: object
          additionalProperties: true
    BuyerListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            buyers:
              type: array
              items: { $ref: '#/components/schemas/Buyer' }
    UserListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            users:
              type: array
              items: { $ref: '#/components/schemas/User' }
    DashboardResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            dashboard:
              type: object
              properties:
                role: { type: string }
                metrics:
                  type: object
                  additionalProperties: true
                recent_raffles:
                  type: array
                  items: { $ref: '#/components/schemas/Raffle' }
                recent_tickets:
                  type: array
                  items: { $ref: '#/components/schemas/Ticket' }
