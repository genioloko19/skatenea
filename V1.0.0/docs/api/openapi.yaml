components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    RaffleId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    TicketId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: No autenticado o token invÃ¡lido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Sin permisos para la operaciÃ³n
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflicto de estado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Datos invÃ¡lidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: LÃ­mite de solicitudes excedido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RaffleResponse:
      description: Rifa
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  raffle: { $ref: '#/components/schemas/Raffle' }
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status: { type: string, enum: [ok, degraded] }
            version: { type: string }
            environment: { type: string }
            database: { type: string, enum: [ok, error] }
            timestamp: { type: string, format: date-time }
    SessionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token: { type: string }
            token_type: { type: string, enum: [Bearer] }
            expires_in: { type: integer }
            csrf_token: { type: string }
            user: { $ref: '#/components/schemas/User' }
            permissions:
              type: array
              items: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        role: { type: string, enum: [super_admin, leader, seller, buyer] }
        status: { type: string, enum: [active, inactive, locked] }
        phone: { type: [string, 'null'] }
        document_type: { type: [string, 'null'] }
        document_number: { type: [string, 'null'] }
        must_change_password: { type: boolean }
        last_login_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Preferences:
      type: object
      properties:
        theme:
          type: string
          enum: [aurora, neon, sunset, ocean, forest, candy, cyber, royal, terracotta, mono, tropical, galaxy]
        mode:
          type: string
          enum: [light, dark, contrast]
        geometry:
          type: string
          enum: [soft, sharp, pill, organic]
        background:
          type: string
          enum: [aurora, mesh, waves, orbs, grid, static]
        sidebar_collapsed:
          type: integer
          minimum: 0
          maximum: 1
    RaffleStatus:
      type: string
      enum: [draft, pending_approval, approved, active, closed, finished, cancelled, rejected]
    Raffle:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        prize: { type: string }
        ticket_price: { type: number }
        total_tickets: { type: integer }
        status: { $ref: '#/components/schemas/RaffleStatus' }
        created_by: { type: string, format: uuid }
        approved_by: { type: [string, 'null'], format: uuid }
        approved_at: { type: [string, 'null'], format: date-time }
        rejection_reason: { type: [string, 'null'] }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        draw_seed_hash: { type: [string, 'null'] }
        winner_ticket_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        stats:
          type: object
          properties:
            total: { type: integer }
            available: { type: integer }
            reserved: { type: integer }
            paid: { type: integer }
            cancelled: { type: integer }
            revenue: { type: number }
    CreateRaffleRequest:
      type: object
      required: [name, prize, ticket_price, total_tickets, start_at, end_at]
      properties:
        name: { type: string, minLength: 3, maxLength: 150 }
        description: { type: string, maxLength: 5000 }
        prize: { type: string, maxLength: 255 }
        ticket_price: { type: number, minimum: 0 }
        total_tickets: { type: integer, minimum: 1, maximum: 1000000 }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        code: { type: string, maxLength: 30 }
    UpdateRaffleRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        prize: { type: string }
        ticket_price: { type: number }
        total_tickets: { type: integer }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        code: { type: string }
    TicketStatus:
      type: string
      enum: [available, reserved, paid, cancelled, winner]
    Ticket:
      type: object
      properties:
        id: { type: string, format: uuid }
        raffle_id: { type: string, format: uuid }
        number: { type: integer }
        seller_id: { type: [string, 'null'], format: uuid }
        buyer_id: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/TicketStatus' }
        price: { type: number }
        qr_token: { type: string }
        reserved_until: { type: [string, 'null'], format: date-time }
        reserved_at: { type: [string, 'null'], format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        buyer_name: { type: [string, 'null'] }
        seller_name: { type: [string, 'null'] }
        raffle_name: { type: [string, 'null'] }
    Buyer:
      type: object
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        email: { type: [string, 'null'], format: email }
        phone: { type: string }
        document_type: { type: [string, 'null'] }
        document_number: { type: [string, 'null'] }
        user_id: { type: [string, 'null'], format: uuid }
        created_by: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        scopes:
          type: array
          items: { type: string }
        created_by: { type: string, format: uuid }
        last_used_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: [string, 'null'], format: uuid }
        actor_type: { type: string }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: [string, 'null'] }
        before_json: { type: [string, 'null'] }
        after_json: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
