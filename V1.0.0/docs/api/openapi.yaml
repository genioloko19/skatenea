openapi: 3.1.0
info:
  title: SKATENEA API
  version: 1.0.0
  description: |
    API REST de SKATENEA para la gestiÃ³n multi-rifa.

    - AutenticaciÃ³n de usuario: JWT Bearer de corta duraciÃ³n + refresh token HttpOnly rotativo.
    - Integraciones: API keys con scopes mediante `X-API-Key`.
    - Todas las respuestas exitosas usan el sobre `{ "data": ... }`; los errores usan `{ "error": { "code", "message", "details?" } }`.
    - Fechas en UTC (ISO 8601). Dinero en COP con dos decimales.
servers:
  - url: http://localhost:8000/api/v1
    description: Desarrollo local (PHP built-in server)
  - url: /api/v1
    description: ProducciÃ³n (mismo origen)
tags:
  - name: Salud
  - name: AutenticaciÃ³n
  - name: PÃºblico
  - name: Dashboard
  - name: Rifas
  - name: Boletas
  - name: Compradores
  - name: Usuarios
  - name: Preferencias
  - name: API Keys
  - name: AuditorÃ­a
  - name: ConfiguraciÃ³n
  - name: Integraciones
paths:
  /health:
    get:
      tags: [Salud]
      summary: Estado de la API y la base de datos
      security: []
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Servicio degradado
  /auth/login:
    post:
      tags: [AutenticaciÃ³n]
      summary: Iniciar sesiÃ³n
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '200':
          description: SesiÃ³n iniciada. Establece cookies `skatenea_refresh` (HttpOnly) y `skatenea_csrf`.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [AutenticaciÃ³n]
      summary: Rotar la sesiÃ³n usando la cookie de refresh
      security: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Nueva sesiÃ³n rotada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [AutenticaciÃ³n]
      summary: Cerrar sesiÃ³n y revocar el refresh token
      security: []
      responses:
        '204': { description: SesiÃ³n cerrada }
  /auth/register:
    post:
      tags: [AutenticaciÃ³n]
      summary: Registrar una cuenta de comprador
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, password, phone]
              properties:
                full_name: { type: string, minLength: 3, maxLength: 150 }
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                phone: { type: string, minLength: 7, maxLength: 30 }
                document_type: { type: string, enum: [CC, CE, PA, NIT] }
                document_number: { type: string, maxLength: 50 }
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/me:
    get:
      tags: [AutenticaciÃ³n]
      summary: Obtener el usuario autenticado, permisos y preferencias
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: SesiÃ³n actual
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      permissions:
                        type: array
                        items: { type: string }
                      preferences: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password:
    patch:
      tags: [AutenticaciÃ³n]
      summary: Cambiar la contraseÃ±a y revocar las demÃ¡s sesiones
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 12 }
      responses:
        '204': { description: ContraseÃ±a actualizada }
        '422': { $ref: '#/components/responses/ValidationError' }
  /public/raffles:
    get:
      tags: [PÃºblico]
      summary: Listar rifas pÃºblicas activas
      security: []
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Listado pÃºblico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaffleListResponse'
  /public/raffles/{id}:
    get:
      tags: [PÃºblico]
      summary: Detalle pÃºblico de una rifa activa
      security: []
      parameters:
        - $ref: '#/components/parameters/RaffleId'
      responses:
        '200':
          description: Detalle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaffleDetailResponse'
        '404': { $ref: '#/components/responses/NotFound' }
  /public/tickets/verify/{token}:
    get:
      tags: [PÃºblico]
      summary: Verificar una boleta por token QR
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Resultado de verificaciÃ³n (sin PII)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      verification:
                        type: object
                        properties:
                          valid: { type: boolean }
                          raffle: { type: string }
                          number: { type: integer }
                          status: { type: string }
                          winner: { type: boolean }
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Resumen adaptado al rol
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: MÃ©tricas y actividad reciente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
  /raffles:
    get:
      tags: [Rifas]
      summary: Listar rifas segÃºn el rol
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/RaffleStatus' }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Listado de rifas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaffleListResponse'
    post:
      tags: [Rifas]
      summary: Crear una rifa (lÃ­der o super administrador)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRaffleRequest'
      responses:
        '201':
          description: Rifa creada en borrador
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      raffle: { $ref: '#/components/schemas/Raffle' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /raffles/{id}:
    get:
      tags: [Rifas]
      summary: Detalle de una rifa
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RaffleId'
      responses:
        '200':
          description: Detalle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaffleDetailResponse'
    patch:
      tags: [Rifas]
      summary: Actualizar una rifa (propietario o super administrador)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RaffleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRaffleRequest'
      responses:
        '200':
          description: Rifa actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      raffle: { $ref: '#/components/schemas/Raffle' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /raffles/{id}/submit:
    post:
      tags: [Rifas]
      summary: Enviar una rifa a aprobaciÃ³n
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RaffleId'
      responses:
        '200': { $ref: '#/components/responses/RaffleResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /raffles/{id}/approve:
    post:
      tags: [Rifas]
      summary: Aprobar una rifa (solo super administrador)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RaffleId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/RaffleResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /raffles/{id}/reject:
    post:
      tags: [Rifas]
      summary: Rechazar una rifa (solo super administrador)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RaffleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/RaffleResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /raffles/{id}/activate:
    post:
      tags: [Rifas]
      summary: Activar una rifa aprobada
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RaffleId'
      responses:
        '200': { $ref: '#/components/responses/RaffleResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /raffles/{id}/close:
    post:
      tags: [Rifas]
      summary: Cerrar una rifa activa
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RaffleId'
      responses:
        '200': { $ref: '#/components/responses/RaffleResponse' }
  /raffles/{id}/cancel:
    post:
      tags: [Rifas]
      summary: Cancelar una rifa (solo super administrador)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RaffleId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/RaffleResponse' }
  /raffles/{id}/sellers:
    post:
      tags: [Rifas]
      summary: Asignar vendedores a una rifa
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RaffleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seller_ids]
              properties:
                seller_ids:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Vendedores asignados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sellers:
                        type: array
                        items: { type: object }
  /raffles/{id}/tickets/generate:
    post:
      tags: [Rifas]
      summary: Generar las boletas de una rifa aprobada o activa
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RaffleId'
      responses:
        '201':
          description: Boletas generadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ticket_stats:
                        type: object
                        additionalProperties: { type: integer }
        '409': { $ref: '#/components/responses/Conflict' }
  /raffles/{id}/tickets/assign:
    post:
      tags: [Rifas]
      summary: Asignar un rango de boletas a un vendedor
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RaffleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seller_id, from, to]
              properties:
                seller_id: { type: string, format: uuid }
                from: { type: integer, minimum: 1 }
                to: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Rango actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      updated: { type: integer }
  /raffles/{id}/draw:
    post:
      tags: [Rifas]
      summary: Realizar el sorteo (solo super administrador)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RaffleId'
      responses:
        '200':
          description: Ganadora y semilla
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      raffle_id: { type: string }
                      winner: { $ref: '#/components/schemas/Ticket' }
                      seed: { type: string }
                      seed_hash: { type: string }
                      paid_tickets: { type: integer }
        '409': { $ref: '#/components/responses/Conflict' }
  /raffles/{id}/approvals:
    get:
      tags: [Rifas]
      summary: Historial de aprobaciÃ³n
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RaffleId'
      responses:
        '200':
          description: Eventos de aprobaciÃ³n
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      approvals:
                        type: array
                        items: { type: object }
  /raffles/{id}/tickets:
    get:
      tags: [Boletas]
      summary: Listar boletas de una rifa
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RaffleId'
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/TicketStatus' }
        - in: query
          name: seller_id
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, default: 1000 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Boletas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketListResponse'
  /tickets/mine:
    get:
      tags: [Boletas]
      summary: Boletas del usuario autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Boletas propias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketListResponse'
  /tickets/{id}:
    get:
      tags: [Boletas]
      summary: Detalle de una boleta
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Boleta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ticket: { $ref: '#/components/schemas/Ticket' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tickets/{id}/reserve:
    post:
      tags: [Boletas]
      summary: Separar una boleta (vendedor propietario o super administrador)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                buyer_id: { type: string, format: uuid }
                full_name: { type: string, maxLength: 150 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 30 }
                document_type: { type: string, enum: [CC, CE, PA, NIT] }
                document_number: { type: string, maxLength: 50 }
                reservation_hours: { type: integer, minimum: 1, maximum: 168, default: 48 }
      responses:
        '200':
          description: Boleta separada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ticket: { $ref: '#/components/schemas/Ticket' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tickets/{id}/pay:
    post:
      tags: [Boletas]
      summary: Registrar el pago de una boleta separada
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [cash, transfer, card, nequi, daviplata, other] }
                reference: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Pago registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ticket: { $ref: '#/components/schemas/Ticket' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tickets/{id}/cancel:
    post:
      tags: [Boletas]
      summary: Anular una boleta
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Boleta anulada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ticket: { $ref: '#/components/schemas/Ticket' }
  /buyers:
    get:
      tags: [Compradores]
      summary: Buscar compradores (mÃ­nimo 2 caracteres)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2 }
      responses:
        '200':
          description: Resultados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerListResponse'
    post:
      tags: [Compradores]
      summary: Registrar un comprador
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, phone]
              properties:
                full_name: { type: string, maxLength: 150 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 30 }
                document_type: { type: string, enum: [CC, CE, PA, NIT] }
                document_number: { type: string, maxLength: 50 }
      responses:
        '201':
          description: Comprador creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      buyer: { $ref: '#/components/schemas/Buyer' }
  /buyers/{id}:
    get:
      tags: [Compradores]
      summary: Detalle de un comprador
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Comprador
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      buyer: { $ref: '#/components/schemas/Buyer' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Compradores]
      summary: Actualizar un comprador
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                document_type: { type: string }
                document_number: { type: string }
      responses:
        '200':
          description: Comprador actualizado
  /sellers:
    get:
      tags: [Usuarios]
      summary: Listar vendedores activos (para asignaciÃ³n)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Vendedores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
  /users:
    get:
      tags: [Usuarios]
      summary: Listar usuarios (solo super administrador)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: role
          schema: { type: string, enum: [super_admin, leader, seller, buyer] }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
    post:
      tags: [Usuarios]
      summary: Crear un usuario (solo super administrador)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, password, role]
              properties:
                full_name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                role: { type: string, enum: [super_admin, leader, seller, buyer] }
                phone: { type: string }
                document_type: { type: string, enum: [CC, CE, PA, NIT] }
                document_number: { type: string }
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                type: object
                properties:
